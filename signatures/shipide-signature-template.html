<table cellpadding="0" cellspacing="0" role="presentation" background="https://portal.shipide.com/signatures/group-11182-corner@2x.png" style="border-collapse:separate;border-spacing:0;width:352px;background:#00060f url('https://portal.shipide.com/signatures/group-11182-corner@2x.png') no-repeat right top;background-size:112px auto;border:1px solid #202838;border-radius:4px;font-family:Helvetica,Arial,sans-serif;color:#f8fafc;">
  <tr>
    <td style="padding:13px 20px;vertical-align:top;">
      <table cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:collapse;width:310px;">
        <tr>
          <td style="padding:0 0 4px 0;vertical-align:top;">
            <div style="font-size:12px;line-height:15px;font-weight:500;color:#f8fafc;letter-spacing:0;">
              {{name}}
            </div>
            <div style="font-size:10.5px;line-height:14px;color:#98a2b3;letter-spacing:0;">
              {{title}}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:4px 0 0 0;">
            <table cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:collapse;width:100%;border-top:1px solid #263142;">
              <tr>
                <td style="padding:7px 9px 0 0;vertical-align:middle;width:58px;">
                  <a href="https://shipide.com" style="color:#f8fafc;text-decoration:none;border:0;">
                    <img
                      src="https://portal.shipide.com/assets/shipide-logo-white.png"
                      width="54"
                      alt="Shipide"
                      style="display:block;width:54px;height:auto;border:0;"
                    />
                  </a>
                </td>
                <td style="padding:7px 0 0 0;vertical-align:middle;font-size:10.5px;line-height:14px;color:#98a2b3;text-align:right;white-space:nowrap;width:100%;">
                  <a href="mailto:{{email}}" style="color:#f8fafc;text-decoration:none;">{{email}}</a>
                  <span style="display:inline-block;height:11px;margin:0 7px;border-left:1px solid #475467;vertical-align:-2px;"></span>
                  <a href="tel:{{phoneHref}}" style="color:#f8fafc;text-decoration:none;">{{phone}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
